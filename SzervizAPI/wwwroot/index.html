<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szerviz - Ügyfelek</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f4f9;
            color: #333;
        }

        h1, h2 {
            color: #0056b3;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        th, td {
            padding: 12px 15px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #0056b3;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .form-container {
            margin-top: 30px;
            background: #fff;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            border-radius: 5px;
        }

        input {
            padding: 8px;
            margin-right: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        button {
            padding: 8px 15px;
            background: #0056b3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

            button:hover {
                background: #004085;
            }

        .delete-btn {
            background: #dc3545;
        }

            .delete-btn:hover {
                background: #b02a37;
            }

        .edit-btn {
            background: #ffc107;
            color: #333;
            margin-right: 5px;
        }

            .edit-btn:hover {
                background: #e0a800;
            }
    </style>
</head>
<body>

    <h1>Ügyfelek listája</h1>

    <div class="form-container">
        <h2 id="form-title">Új ügyfél felvétele</h2>
        <form id="ugyfel-form">
            <input type="text" id="nev" placeholder="Név" required>
            <input type="text" id="telefon" placeholder="Telefon" required>
            <input type="email" id="email" placeholder="Email" required>
            <button type="submit" id="submit-btn">Mentés</button>
        </form>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Név</th>
                <th>Telefon</th>
                <th>Email</th>
                <th>Művelet</th>
            </tr>
        </thead>
        <tbody id="ugyfelek-lista">
            <!-- Ide jönnek majd a dinamikus adatok JavaScript-tel -->
        </tbody>
    </table>

    <script>
                        let editId = null;

                        // Adatok betöltése listázáshoz (GET)
                        function loadUgyfelek() {
                            fetch('/api/ugyfelek')
                                .then(response => response.json())
                                .then(data => {
                                    const tbody = document.getElementById('ugyfelek-lista');
                                    tbody.innerHTML = '';

                                    data.forEach(ugyfel => {
                                        const tr = document.createElement('tr');
                                        tr.innerHTML = `
                                            <td>${ugyfel.id}</td>
                                            <td>${ugyfel.nev}</td>
                                            <td>${ugyfel.telefon}</td>
                                            <td>${ugyfel.email}</td>
                                            <td>
                                                <button class="edit-btn" onclick="editUgyfel(${ugyfel.id}, '${ugyfel.nev}', '${ugyfel.telefon}', '${ugyfel.email}')">Szerkesztés</button>
                                                <button class="delete-btn" onclick="deleteUgyfel(${ugyfel.id})">Törlés</button>
                                            </td>
                                        `;
                                        tbody.appendChild(tr);
                                    });
                                })
                                .catch(error => console.error('Hiba a lekérdezés során:', error));
                        }

                        // Adatok betöltése szerkesztéshez
                        function editUgyfel(id, nev, telefon, email) {
                            editId = id;
                            document.getElementById('nev').value = nev;
                            document.getElementById('telefon').value = telefon;
                            document.getElementById('email').value = email;
                            document.getElementById('form-title').innerText = 'Ügyfél módosítása';
                            document.getElementById('submit-btn').innerText = 'Módosítás';
                        }

                        // Új ügyfél küldése (POST) vagy meglévő módosítása (PUT)
                        document.getElementById('ugyfel-form').addEventListener('submit', function(e) {
                            e.preventDefault();

                            const ugyfel = {
                                nev: document.getElementById('nev').value,
                                telefon: document.getElementById('telefon').value,
                                email: document.getElementById('email').value
                            };

                            const url = editId ? `/api/ugyfelek/${editId}` : '/api/ugyfelek';
                            const method = editId ? 'PUT' : 'POST';

                            fetch(url, {
                                method: method,
                                headers: {
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify(ugyfel)
                            })
                            .then(response => {
                                if (response.ok) {
                                    document.getElementById('ugyfel-form').reset();
                                    editId = null;
                                    document.getElementById('form-title').innerText = 'Új ügyfél felvétele';
                                    document.getElementById('submit-btn').innerText = 'Mentés';
                                    loadUgyfelek();
                                } else {
                                    alert('Hiba történt a mentés során!');
                                }
                            })
                            .catch(error => console.error('Hiba:', error));
                        });

                        // Ügyfél törlése (DELETE)
                        function deleteUgyfel(id) {
                            if (confirm('Biztosan törölni szeretnéd ezt az ügyfelet?')) {
                                fetch(`/api/ugyfelek/${id}`, {
                                    method: 'DELETE'
                                })
                                .then(response => {
                                    if (response.ok) {
                                        loadUgyfelek();
                                    } else {
                                        alert('Hiba történt a törlés során!');
                                    }
                                })
                                .catch(error => console.error('Hiba:', error));
                            }
                        }

                        // Oldal betöltésekor lekérjük az adatokat
                        loadUgyfelek();
    </script>
</body>
</html>
